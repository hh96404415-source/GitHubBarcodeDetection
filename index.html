<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多重條碼掃描與上傳系統</title>
    <!-- 引入 Tailwind CSS 進行快速排版與樣式設定 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Phosphor Icons 作為圖示 -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        
        #video-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 0.75rem; /* rounded-xl */
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        #camera-stream {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* 覆蓋在影片上方的畫布，用於繪製標記框 */
        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 讓點擊事件穿透到下層 */
        }

        .scanning-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(34, 197, 94, 0.8); /* green-500 */
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
            animation: scan 2s infinite linear;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* 滾動條美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <header class="w-full max-w-2xl mb-6 text-center">
        <h1 class="text-3xl font-bold text-gray-800 flex items-center justify-center gap-2">
            <i class="ph ph-barcode text-4xl text-blue-600"></i>
            多重條碼掃描器
        </h1>
        <p class="text-gray-500 mt-2">將相機對準條碼，支援同時識別多個條碼並上傳至 Google Sheets。</p>
    </header>

    <main class="w-full max-w-2xl flex flex-col gap-6">
        
        <!-- 相機預覽區域 -->
        <div class="relative bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <div id="video-container" class="aspect-video flex items-center justify-center bg-gray-900">
                <video id="camera-stream" autoplay playsinline muted></video>
                <canvas id="overlay-canvas"></canvas>
                <div id="scan-line" class="scanning-line"></div>
                
                <!-- 初始狀態提示 -->
                <div id="initial-message" class="absolute inset-0 flex flex-col items-center justify-center text-white bg-black/50 z-10">
                    <i class="ph ph-camera text-4xl mb-2"></i>
                    <span>點擊下方按鈕啟動相機</span>
                </div>
            </div>

            <!-- 控制按鈕列 -->
            <div class="mt-4 flex flex-wrap gap-3 justify-center">
                <button id="btn-start" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-colors shadow-sm">
                    <i class="ph ph-play-circle text-xl"></i> 開始掃描
                </button>
                <button id="btn-stop" class="flex items-center gap-2 bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-6 rounded-lg transition-colors shadow-sm hidden">
                    <i class="ph ph-stop-circle text-xl"></i> 停止掃描
                </button>
                <button id="btn-upload" class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-6 rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="ph ph-cloud-arrow-up text-xl"></i> 上傳結果 (<span id="upload-count">0</span>)
                </button>
            </div>
            
            <div id="status-message" class="mt-3 text-center text-sm font-medium text-gray-600 h-5">
                準備就緒
            </div>
        </div>

        <!-- 掃描結果列表 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col" style="height: 300px;">
            <div class="bg-gray-50 border-b border-gray-200 px-4 py-3 flex justify-between items-center">
                <h3 class="font-semibold text-gray-700 flex items-center gap-2">
                    <i class="ph ph-list-dashes text-lg"></i> 掃描結果清單
                </h3>
                <button id="btn-clear" class="text-sm text-gray-500 hover:text-red-500 transition-colors flex items-center gap-1">
                    <i class="ph ph-trash"></i> 清空
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-2" id="results-container">
                <!-- 結果項目將動態插入此處 -->
                <div id="empty-results-msg" class="h-full flex items-center justify-center text-gray-400 text-sm">
                    尚無掃描結果，請開始掃描...
                </div>
                <ul id="results-list" class="flex flex-col gap-2 hidden"></ul>
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // 配置區 (請替換為你的 GAS Web App URL)
        // ==========================================
        const GAS_WEB_APP_URL = '請將這裡替換為你的_GAS_網頁應用程式網址';
        
        // DOM 元素
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');
        const scanLine = document.getElementById('scan-line');
        const initialMessage = document.getElementById('initial-message');
        const statusMessage = document.getElementById('status-message');
        
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnUpload = document.getElementById('btn-upload');
        const btnClear = document.getElementById('btn-clear');
        
        const resultsList = document.getElementById('results-list');
        const emptyResultsMsg = document.getElementById('empty-results-msg');
        const uploadCountSpan = document.getElementById('upload-count');

        // 狀態變數
        let stream = null;
        let barcodeDetector = null;
        let animationId = null;
        let scannedDataMap = new Map(); // 使用 Map 來避免重複條碼 (Key: rawValue, Value: BarcodeObject)
        let isScanning = false;

        // 檢查環境支援
        async function checkCompatibility() {
            if (!('BarcodeDetector' in window)) {
                showStatus("您的瀏覽器不支援原生的 BarcodeDetector API。請使用最新版的 Chrome/Edge (桌面或 Android)。", 'text-red-600');
                btnStart.disabled = true;
                return false;
            }
            try {
                // 初始化偵測器，設定支援的格式
                const supportedFormats = await BarcodeDetector.getSupportedFormats();
                barcodeDetector = new BarcodeDetector({ 
                    formats: supportedFormats.length > 0 ? supportedFormats : ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39'] 
                });
                return true;
            } catch (e) {
                showStatus("初始化條碼偵測器失敗。", 'text-red-600');
                return false;
            }
        }

        // 啟動相機
        async function startCamera() {
            if (!(await checkCompatibility())) return;

            try {
                showStatus("正在請求相機權限...", 'text-blue-600');
                // 請求後置鏡頭 (環境鏡頭)
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                
                // 等待影片元資料加載完成，設定畫布大小
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    initialMessage.style.display = 'none';
                    scanLine.style.display = 'block';
                    
                    // 切換按鈕狀態
                    btnStart.classList.add('hidden');
                    btnStop.classList.remove('hidden');
                    isScanning = true;
                    showStatus("掃描中...", 'text-green-600');
                    
                    // 開始偵測迴圈
                    detectBarcodes();
                };
            } catch (err) {
                console.error("存取相機錯誤:", err);
                showStatus("無法存取相機，請確認權限設定。", 'text-red-600');
            }
        }

        // 停止相機
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            isScanning = false;
            scanLine.style.display = 'none';
            initialMessage.style.display = 'flex';
            
            // 清除畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 切換按鈕狀態
            btnStop.classList.add('hidden');
            btnStart.classList.remove('hidden');
            showStatus("已停止掃描。", 'text-gray-600');
        }

        // 核心偵測函數 (遞迴呼叫)
        async function detectBarcodes() {
            if (!isScanning) return;

            try {
                // 確保影片正在播放且有畫面
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    // 執行偵測
                    const barcodes = await barcodeDetector.detect(video);
                    
                    // 清空上一幀的畫布
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (barcodes.length > 0) {
                        barcodes.forEach(barcode => {
                            // 1. 在畫布上繪製邊框
                            drawBarcodeBox(barcode);
                            
                            // 2. 處理掃描結果 (去重)
                            if (!scannedDataMap.has(barcode.rawValue)) {
                                scannedDataMap.set(barcode.rawValue, {
                                    value: barcode.rawValue,
                                    format: barcode.format,
                                    time: new Date().toLocaleTimeString()
                                });
                                // 震動回饋 (如果設備支援)
                                if (navigator.vibrate) navigator.vibrate(100);
                                // 更新 UI
                                updateResultsUI();
                            }
                        });
                    }
                }
            } catch (err) {
                console.error("偵測條碼時發生錯誤:", err);
            }

            // 請求下一幀繼續偵測
            animationId = requestAnimationFrame(detectBarcodes);
        }

        // 在 Canvas 上繪製條碼標記框
        function drawBarcodeBox(barcode) {
            const { cornerPoints } = barcode;
            if (!cornerPoints || cornerPoints.length < 4) return;

            ctx.beginPath();
            ctx.moveTo(cornerPoints[0].x, cornerPoints[0].y);
            for (let i = 1; i < cornerPoints.length; i++) {
                ctx.lineTo(cornerPoints[i].x, cornerPoints[i].y);
            }
            ctx.closePath();
            
            // 樣式設定
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#22c55e'; // 綠色邊框
            ctx.fillStyle = 'rgba(34, 197, 94, 0.2)'; // 半透明綠色填充
            ctx.stroke();
            ctx.fill();

            // 繪製文字背景與文字
            const text = barcode.rawValue;
            ctx.font = '16px Inter, sans-serif';
            const textWidth = ctx.measureText(text).width;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(cornerPoints[0].x, cornerPoints[0].y - 25, textWidth + 10, 24);
            
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, cornerPoints[0].x + 5, cornerPoints[0].y - 8);
        }

        // 更新結果列表 UI
        function updateResultsUI() {
            const count = scannedDataMap.size;
            uploadCountSpan.textContent = count;
            btnUpload.disabled = count === 0;

            if (count > 0) {
                emptyResultsMsg.classList.add('hidden');
                resultsList.classList.remove('hidden');
                
                // 重新渲染列表
                resultsList.innerHTML = '';
                // 將 Map 轉為 Array 並反轉，讓最新掃描的在最上面
                Array.from(scannedDataMap.values()).reverse().forEach(data => {
                    const li = document.createElement('li');
                    li.className = 'bg-white border border-gray-100 p-3 rounded-lg shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-2';
                    li.innerHTML = `
                        <div class="flex flex-col overflow-hidden">
                            <span class="font-mono text-sm font-semibold text-gray-800 truncate" title="${data.value}">${data.value}</span>
                            <div class="flex gap-2 text-xs text-gray-500 mt-1">
                                <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">${data.format}</span>
                                <span>${data.time}</span>
                            </div>
                        </div>
                        <button onclick="removeBarcode('${data.value}')" class="text-gray-400 hover:text-red-500 p-1 self-end sm:self-auto transition-colors">
                            <i class="ph ph-x-circle text-xl"></i>
                        </button>
                    `;
                    resultsList.appendChild(li);
                });
            } else {
                emptyResultsMsg.classList.remove('hidden');
                resultsList.classList.add('hidden');
                resultsList.innerHTML = '';
            }
        }

        // 移除單一條碼 (供 UI 上的 X 按鈕呼叫)
        window.removeBarcode = function(value) {
            scannedDataMap.delete(value);
            updateResultsUI();
        }

        // 清空所有結果
        function clearResults() {
            scannedDataMap.clear();
            updateResultsUI();
        }

        // 上傳資料到 GAS
        async function uploadData() {
            if (scannedDataMap.size === 0) return;
            if (GAS_WEB_APP_URL.includes('請將這裡替換')) {
                alert("請先在程式碼中設定 GAS_WEB_APP_URL！");
                return;
            }

            const barcodesArray = Array.from(scannedDataMap.values()).map(item => ({
                value: item.value,
                format: item.format
            }));

            const payload = { barcodes: barcodesArray };
            
            // 更新 UI 狀態為上傳中
            btnUpload.disabled = true;
            const originalBtnHtml = btnUpload.innerHTML;
            btnUpload.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i> 上傳中...';
            showStatus("正在將資料上傳至 Google Sheets...", 'text-blue-600');

            try {
                // 發送 POST 請求至 GAS
                // 注意：GAS Web App 通常會回傳重定向 (302)，但在 CORS 設定下，
                // fetch 會默默處理或者我們使用 'no-cors'，但 'no-cors' 無法讀取回應。
                // 若要讀取回應，GAS 必須正確處理 OPTIONS (Preflight) 請求 (如後端程式碼所示)
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8', // 避免一些 CORS 複雜預檢問題，有時 GAS 更好處理 text/plain
                    },
                    // 將 JSON 轉為字串發送
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.status === 'success') {
                        showStatus("✅ 上傳成功！", 'text-green-600');
                        clearResults(); // 上傳成功後清空列表
                    } else {
                        showStatus(`❌ 上傳失敗: ${result.message}`, 'text-red-600');
                    }
                } else {
                    throw new Error(`HTTP 狀態碼錯誤: ${response.status}`);
                }
            } catch (error) {
                console.error("上傳錯誤:", error);
                showStatus("❌ 網路連線錯誤或 CORS 問題，請檢查控制台日誌。", 'text-red-600');
            } finally {
                // 恢復按鈕狀態
                btnUpload.innerHTML = originalBtnHtml;
                updateResultsUI(); // 根據當前 Map 大小恢復 disabled 狀態
            }
        }

        // 輔助函數：顯示狀態訊息
        function showStatus(msg, colorClass) {
            statusMessage.textContent = msg;
            statusMessage.className = `mt-3 text-center text-sm font-medium h-5 ${colorClass}`;
        }

        // 綁定事件
        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        btnUpload.addEventListener('click', uploadData);
        btnClear.addEventListener('click', clearResults);

        // 頁面載入時進行基本檢查
        window.addEventListener('DOMContentLoaded', () => {
            if (!('BarcodeDetector' in window)) {
                showStatus("警告：當前瀏覽器可能不支援原生條碼識別。建議使用 Chrome Android。", 'text-yellow-600');
            }
        });
    </script>
</body>
</html>
